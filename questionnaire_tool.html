<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>问卷自动计分与分类查看</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb; --panel: #ffffff; --panel-2: #eef3f9; --text: #172b4d;
      --muted: #667085; --line: #d9e2ef; --primary: #356ae6; --primary-2: #e8efff;
      --danger: #b42318; --danger-bg: #fff0ee; --warn: #9a6700; --warn-bg: #fff8df;
      --ok: #027a48; --ok-bg: #e9f8f0; --shadow: 0 12px 30px rgba(31, 56, 88, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #101722; --panel: #172231; --panel-2: #223044; --text: #edf4ff;
        --muted: #a7b4c8; --line: #34445a; --primary: #83a8ff; --primary-2: #263b67;
        --danger: #ffb4aa; --danger-bg: #4b2527; --warn: #ffd66b; --warn-bg: #4b3a17;
        --ok: #7ce5ad; --ok-bg: #153e2c; --shadow: 0 12px 30px rgba(0, 0, 0, .25); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app-shell { max-width: 1640px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .brand h1 { margin: 0; font-size: 25px; letter-spacing: -.02em; }
    .brand p { margin: 4px 0 0; color: var(--muted); }
    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .language-control { display: flex; flex-direction: column; gap: 2px; min-width: 190px; }
    .language-control small { color: var(--muted); font-size: 11px; line-height: 1.25; }
    .upload-label, .btn { border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; background: var(--panel); color: var(--text); font-weight: 650; }
    .upload-label, .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn:hover, .upload-label:hover { filter: brightness(.96); }
    input[type=file] { display: none; }
    .privacy { color: var(--ok); background: var(--ok-bg); border: 1px solid color-mix(in srgb, var(--ok) 25%, transparent); padding: 8px 12px; border-radius: 999px; font-size: 12px; }
    .notice { border-radius: 10px; padding: 11px 14px; margin: 0 0 16px; border: 1px solid var(--line); background: var(--panel); }
    .notice.error { color: var(--danger); background: var(--danger-bg); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
    .notice.warn { color: var(--warn); background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
    .notice.ok { color: var(--ok); background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
    .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; align-items: start; }
    .sidebar, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
    .sidebar { padding: 15px; position: sticky; top: 14px; }
    .sidebar h3 { margin: 2px 0 13px; font-size: 14px; }
    .sidebar details { border-top: 1px solid var(--line); padding: 11px 0; }
    .sidebar details:first-of-type { border-top: 0; }
    .sidebar summary { cursor: pointer; font-weight: 750; color: var(--text); margin-bottom: 9px; }
    .field { margin: 0 0 14px; }
    .field label { display: block; font-weight: 650; margin-bottom: 5px; }
    .field small, .muted { color: var(--muted); }
    select, input[type=number], input[type=text], textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; background: var(--panel); }
    select[multiple] { min-height: 86px; }
    .range-row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; }
    .check input { margin-top: 4px; accent-color: var(--primary); }
    .main { min-width: 0; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 5px; background: var(--panel-2); border-radius: 11px; margin-bottom: 15px; }
    .tab { white-space: nowrap; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px; color: var(--muted); font-weight: 650; }
    .tab.active { background: var(--panel); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .panel { padding: 18px; overflow: hidden; }
    .panel h2 { margin: 0 0 5px; font-size: 19px; }
    .panel h3 { margin: 22px 0 9px; font-size: 15px; }
    .panel-subtitle { margin: 0 0 15px; color: var(--muted); }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat { border: 1px solid var(--line); background: var(--panel-2); padding: 12px; border-radius: 11px; }
    .stat b { display: block; font-size: 22px; margin-top: 2px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .table-wrap { overflow: auto; max-height: 64vh; border: 1px solid var(--line); border-radius: 9px; }
    .viz-controls { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 10px; align-items: end; margin-bottom: 16px; }
    .viz-controls .field { margin: 0; }
    .viz-chart { width: 100%; overflow: hidden; }
    .viz-chart svg { display: block; width: 100%; height: auto; min-height: 300px; }
    .viz-chart text { fill: var(--text); font-size: 12px; }
    .viz-chart .gridline { stroke: var(--line); stroke-width: 1; }
    .viz-chart .axisline { stroke: var(--muted); stroke-width: 1; }
    .viz-chart .bar { fill: var(--primary); opacity: .82; }
    .viz-chart .line { fill: none; stroke: var(--primary); stroke-width: 3; }
    .viz-chart .point { fill: var(--ok); stroke: var(--panel); stroke-width: 2; }
    .viz-caption { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
    @media (max-width: 900px) { .viz-controls { grid-template-columns: repeat(2, minmax(140px, 1fr)); } }
    @media (max-width: 520px) { .viz-controls { grid-template-columns: 1fr; } }
    table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); font-weight: 700; }
    tr:last-child td { border-bottom: 0; }
    td.score { text-align: right; font-variant-numeric: tabular-nums; }
    td.cell-red { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
    td.cell-yellow { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
    td.cell-purple { background: #f2ebff; color: #6941c6; font-weight: 700; }
    @media (prefers-color-scheme: dark) { td.cell-purple { background: #35285b; color: #d4bbff; } }
    .person-link { border: 0; padding: 0; color: var(--primary); background: transparent; font-weight: 700; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 700; margin-left: 5px; }
    .badge.red { color: var(--danger); background: var(--danger-bg); }
    .badge.yellow { color: var(--warn); background: var(--warn-bg); }
    .badge.ok { color: var(--ok); background: var(--ok-bg); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
    .toolbar-actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
    .detail { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--panel-2); }
    .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; }
    .detail-item { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding: 5px 0; }
    .detail-item span:first-child { color: var(--muted); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .card { border: 1px solid var(--line); border-radius: 11px; padding: 14px; background: var(--panel-2); }
    .card h3 { margin-top: 0; }
    .result { margin-top: 12px; }
    textarea#config-json { min-height: 460px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 9px; }
    .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    @media (max-width: 900px) { .app-shell { padding: 14px; } .topbar { align-items: flex-start; flex-direction: column; } .layout { grid-template-columns: 1fr; } .sidebar { position: static; } .stats-grid { grid-template-columns: repeat(2, 1fr); } .two-col, .detail-grid { grid-template-columns: 1fr; } }
  </style>
</head>

        <h1 id="app-title">问卷自动计分与分类查看</h1>
        <p id="app-subtitle">Psicometria e Personalità · BFI-44 / BIS-BAS / QAS-Short / EPQ-R 等</p>

          <button class="tab" data-tab="rules" type="button">计分规则</button>
        </nav>
        <section id="content" class="panel"></section>
      </main>
    </div>
  </div>

  /* Numerical functions for two-sided Pearson p-values without another CDN. */
  function logGamma(z) { const c=[676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-.13857109526572012,9.984369578019572e-6,1.5056327351493116e-7]; if(z<.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-logGamma(1-z); z-=1; let x=.9999999999998099; c.forEach((v,i)=>x+=v/(z+i+1)); const t=z+c.length-.5; return .5*Math.log(2*Math.PI)+(z+.5)*Math.log(t)-t+Math.log(x); }
  function betaCF(a,b,x) { let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap; if(Math.abs(d)<3e-30)d=3e-30; d=1/d; let h=d; for(let m=1;m<=200;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d;if(Math.abs(d)<3e-30)d=3e-30;c=1+aa/c;if(Math.abs(c)<3e-30)c=3e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<3e-30)d=3e-30;c=1+aa/c;if(Math.abs(c)<3e-30)c=3e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-7)break;}return h; }
  function regBeta(x,a,b) { if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(logGamma(a+b)-logGamma(a)-logGamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betaCF(a,b,x)/a:1-bt*betaCF(b,a,1-x)/b; }
  function studentTCDF(t,df) { if(!Number.isFinite(t))return t<0?0:1; const x=df/(df+t*t), ib=regBeta(x,df/2,.5); return t>=0?1-.5*ib:.5*ib; }
  function pearson(x,y) { const pairs=x.map((v,i)=>[v,y[i]]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])); const n=pairs.length;if(n<3)return {r:NaN,p:NaN,n};const a=pairs.map(p=>p[0]),b=pairs.map(p=>p[1]),ma=mean(a),mb=mean(b),numr=a.reduce((s,v,i)=>s+(v-ma)*(b[i]-mb),0),den=Math.sqrt(a.reduce((s,v)=>s+(v-ma)**2,0)*b.reduce((s,v)=>s+(v-mb)**2,0)),r=den?numr/den:NaN;const t=Number.isFinite(r)&&Math.abs(r)<1?Math.abs(r)*Math.sqrt((n-2)/(1-r*r)):Infinity;return {r,p:Number.isFinite(t)?2*(1-studentTCDF(t,n-2)):0,n}; }
  function analysisCards(records) {
    const factors=state.config.scales.flatMap(s=>s.factors.map(f=>({s,f,key:factorKey(s,f),label:`${scaleLabel(s)} · ${factorLabel(s,f)}`}))); if(factors.length<2)return "";
    return `<div class="two-col"><div class="card"><h3>${t("corr")}</h3><div class="field"><label>${t("factorX")}</label><select id="corr-x">${factors.map((x,i)=>`<option value="${i}">${esc(x.label)}</option>`).join("")}</select></div><div class="field"><label>${t("factorY")}</label><select id="corr-y">${factors.map((x,i)=>`<option value="${i}" ${i===1?"selected":""}>${esc(x.label)}</option>`).join("")}</select></div><div id="corr-result" class="result muted">${t("chooseFactors")}</div></div><div class="card"><h3>${t("ttest")}</h3><div class="field"><label>${t("group")}</label><select id="ttest-group"><option value="gender">${t("gender")}</option><option value="veneto">${t("venetoGroup")}</option><option value="school">${t("school")}</option></select></div><div class="field"><label>${t("outcome")}</label><select id="ttest-outcome">${factors.map((x,i)=>`<option value="${i}">${esc(x.label)}</option>`).join("")}</select></div><div class="two-col"><div class="field"><label>${t("groupA")}</label><select id="ttest-a"></select></div><div class="field"><label>${t("groupB")}</label><select id="ttest-b"></select></div></div><div id="ttest-result" class="result muted">${t("chooseFactors")}</div></div></div><div class="card" style="margin-top:15px"><h3>${t("frequency")}</h3>${frequencyTable(records)}</div>`;

  function frequencyTable(records) { const groups=[[t("gender"),r=>r.gender],[t("school"),r=>r.school],[t("region"),r=>r.region]]; return `<div class="two-col">${groups.map(([label,fn])=>{const c={};records.forEach(r=>{const k=fn(r);c[k]=(c[k]||0)+1;});return `<div><b>${label}</b><table><tbody>${Object.entries(c).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="score">${v}</td></tr>`).join("")}</tbody></table></div>`;}).join("")}</div>`; }
  function groupLabels(records, groupType) { const labels=new Set(); const nonVeneto=t("venetoGroup").split(" / ")[1]; records.forEach(r=>labels.add(groupType==="gender"?r.gender:groupType==="school"?r.school:(r.regionCode===20?"Veneto":nonVeneto))); return [...labels]; }
  function welch(records, groupType, outcome, selectedA, selectedB) {
    const groups={}; const nonVeneto=t("venetoGroup").split(" / ")[1]; records.forEach(r=>{const g=groupType==="gender"?r.gender:groupType==="school"?r.school:(r.regionCode===20?"Veneto":nonVeneto);const v=r.scores[outcome.key];if(Number.isFinite(v)){groups[g]??=[];groups[g].push(v);}}); const names=[selectedA,selectedB]; if(!names[0]||!names[1]||names[0]===names[1])return {errorKey:"chooseDifferent",groups}; if(!groups[names[0]]||!groups[names[1]])return {errorKey:"noGroupData",groups}; if(groups[names[0]].length<2||groups[names[1]].length<2)return {errorKey:"minGroupN",args:{a:names[0],na:groups[names[0]].length,b:names[1],nb:groups[names[1]].length},groups}; const [a,b]=names.map(n=>groups[n]),ma=mean(a),mb=mean(b),va=variance(a),vb=variance(b),se=Math.sqrt(va/a.length+vb/b.length); if(!Number.isFinite(se)||se===0)return {errorKey:"zeroVariance",groups}; const t=(ma-mb)/se,df=(va/a.length+vb/b.length)**2/((va*va)/(a.length*a.length*(a.length-1))+(vb*vb)/(b.length*b.length*(b.length-1))),p=2*(1-studentTCDF(Math.abs(t),df)),pooled=Math.sqrt(((a.length-1)*va+(b.length-1)*vb)/(a.length+b.length-2)); return {names,a,b,ma,mb,sa:Math.sqrt(va),sb:Math.sqrt(vb),t,df,p,d:pooled?(ma-mb)/pooled:NaN}; }
  function bindAnalysisActions(records) { const factors=state.config.scales.flatMap(s=>s.factors.map(f=>({s,f,key:factorKey(s,f),label:`${scaleLabel(s)} · ${factorLabel(s,f)}`}))); const corr=()=>{const x=factors[Number($("#corr-x").value)],y=factors[Number($("#corr-y").value)],res=pearson(records.map(r=>r.scores[x.key]),records.map(r=>r.scores[y.key])); $("#corr-result").innerHTML=`<b>r = ${fmt(res.r)}</b> · n = ${res.n} · ${t("twoSidedP")} = ${fmt(res.p,4)}${res.n<3?`<br>${t("validPairs")}: ${t("tooFewPairs")}`:""}`;}; const refreshGroups=()=>{const labels=groupLabels(records,$("#ttest-group").value); $("#ttest-a").innerHTML=labels.map((x,i)=>`<option value="${esc(x)}">${esc(x)}</option>`).join(""); $("#ttest-b").innerHTML=labels.map((x,i)=>`<option value="${esc(x)}" ${i===1?"selected":""}>${esc(x)}</option>`).join(""); tt();}; const tt=()=>{const out=factors[Number($("#ttest-outcome").value)],res=welch(records,$("#ttest-group").value,out,$("#ttest-a").value,$("#ttest-b").value); let error=""; if(res.errorKey){error=t(res.errorKey);if(res.args)Object.entries(res.args).forEach(([k,v])=>{error=error.replace(`{${k}}`,v);});} $("#ttest-result").innerHTML=error?`<span class="notice warn">${esc(error)}</span>`:`<b>${esc(res.names[0])}</b>: M=${fmt(res.ma)}, SD=${fmt(res.sa)}, n=${res.a.length}<br><b>${esc(res.names[1])}</b>: M=${fmt(res.mb)}, SD=${fmt(res.sb)}, n=${res.b.length}<br>t = ${fmt(res.t)} · df = ${fmt(res.df)} · p = ${fmt(res.p,4)} · Cohen d = ${fmt(res.d)}`;}; $("#corr-x")?.addEventListener("change",corr);$("#corr-y")?.addEventListener("change",corr);$("#ttest-group")?.addEventListener("change",refreshGroups);$("#ttest-outcome")?.addEventListener("change",tt);$("#ttest-a")?.addEventListener("change",tt);$("#ttest-b")?.addEventListener("change",tt);corr();refreshGroups(); }

  function visualizationSvg(data, chartType) {
    if(!data.length)return `<div class="empty">${tx("visualNoData")}</div>`;
    const width=820,height=360,left=64,right=22,top=24,bottom=72,plotW=width-left-right,plotH=height-top-bottom;
    let lo=Math.min(...data.map(d=>Number.isFinite(d.min)?d.min:d.value)),hi=Math.max(...data.map(d=>Number.isFinite(d.max)?d.max:d.value)); if(!Number.isFinite(lo)||!Number.isFinite(hi)){lo=0;hi=1;} if(lo===hi){lo-=1;hi+=1;}
    const y=v=>top+(hi-v)/(hi-lo)*plotH, base=y(lo), step=plotW/data.length, x=i=>left+step*(i+.5), labels=data.map(d=>d.label.length>18?d.label.slice(0,17)+"…":d.label), ticks=Array.from({length:5},(_,i)=>lo+(hi-lo)*i/4);

    const marks=chartType==="bar" ? data.map((d,i)=>{const barW=Math.max(18,step*.62),yy=y(d.value),h=Math.abs(base-yy);return `<rect class="bar" x="${x(i)-barW/2}" y="${Math.min(yy,base)}" width="${barW}" height="${Math.max(1,h)}" rx="3"><title>${esc(d.label)}: ${fmt(d.value)} (${tx("visualN")} ${d.n})</title></rect><text x="${x(i)}" y="${height-bottom+17}" text-anchor="end" transform="rotate(-35 ${x(i)} ${height-bottom+17})">${esc(labels[i])}</text><text x="${x(i)}" y="${Math.min(yy,base)-7}" text-anchor="middle">${fmt(d.value)}</text>`;}).join("") : `<polyline class="line" points="${data.map((d,i)=>`${x(i)},${y(d.value)}`).join(" ")}"></polyline>${data.map((d,i)=>`<circle class="point" cx="${x(i)}" cy="${y(d.value)}" r="5"><title>${esc(d.label)}: ${fmt(d.value)} (${tx("visualN")} ${d.n})</title></circle><text x="${x(i)}" y="${height-bottom+17}" text-anchor="end" transform="rotate(-35 ${x(i)} ${height-bottom+17})">${esc(labels[i])}</text><text x="${x(i)}" y="${y(d.value)-10}" text-anchor="middle">${fmt(d.value)}</text>`).join("")}`;

  }
